<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alejandro Mazo | Le†'$ MAK€ $ΩME┬HING ÐØPE</title>

  <link rel="preload" as="image" href="Hero-2.jpg">
  <link rel="preload" as="image" href="title.png">
  <link rel="preload" as="image" href="logo.png">
  <link rel="preload" as="video" href="reel.mp4">
  <link rel="preload" as="video" href="video2.mp4">

  <style>
    @font-face {
      font-family: Orbitron;
      src: url("Orbitron.ttf");
      font-display: swap;
    }

    :root {
      --page-padding: clamp(18px, 4vw, 64px);
      --content-width: 1440px;
      --line: rgba(255, 255, 255, 0.18);
      --soft-line: rgba(255, 255, 255, 0.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Orbitron, sans-serif;
    }

    html {
      background: #000;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      overflow-x: hidden;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, #181818 0%, #070707 45%, #000 80%);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img,
    video {
      display: block;
      max-width: 100%;
      -webkit-user-drag: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    audio {
      display: none;
    }

    /* HERO */

    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #070707;
    }

    .hero-photo {
      width: 100%;
      height: auto;
      filter: contrast(1.07) brightness(0.98);
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.02) 0%,
          rgba(0, 0, 0, 0) 55%,
          rgba(0, 0, 0, 0.35) 100%
        ),
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.1) 0%,
          rgba(0, 0, 0, 0) 48%,
          rgba(0, 0, 0, 0.04) 100%
        );
    }

    .hero-branding {
      position: absolute;
      z-index: 2;
      top: clamp(22px, 8vw, 145px);
      left: 50%;
      width: min(76vw, 860px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    /* GLITCH */

    .glitch-layer {
      position: relative;
      isolation: isolate;
      display: block;
    }

    .glitch-layer::before,
    .glitch-layer::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background-image: var(--glitch-image);
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      will-change: transform, clip-path, opacity;
    }

    .glitch-layer::before {
      filter: drop-shadow(-4px 0 rgba(0, 233, 255, 0.9));
      animation: glitchCyan 9s steps(1, end) infinite;
    }

    .glitch-layer::after {
      filter: drop-shadow(4px 0 rgba(255, 28, 104, 0.82));
      animation: glitchRed 9s steps(1, end) infinite;
    }

    .title-glitch {
      width: 100%;
    }

    .title-glitch .title-img {
      width: 100%;
      opacity: 0.94;
      animation: glitchBase 9s steps(1, end) infinite;
    }

    .logo-glitch {
      width: min(40%, 230px);
      margin-top: clamp(16px, 4vw, 70px);
      animation-delay: 1.2s;
    }

    .logo-glitch::before {
      animation-delay: 1.2s;
    }

    .logo-glitch::after {
      animation-delay: 1.2s;
    }

    .logo-glitch .logo-img {
      width: 100%;
      opacity: 0.4;
      animation: glitchBase 9s steps(1, end) infinite 1.2s;
    }

    @keyframes glitchBase {
      0%,
      77%,
      100% {
        transform: translate(0);
        filter: none;
      }

      79% {
        transform: translateX(2px);
        filter: contrast(1.35);
      }

      80% {
        transform: translateX(-2px);
      }

      81% {
        transform: translate(0);
        filter: none;
      }
    }

    @keyframes glitchCyan {
      0%,
      77%,
      100% {
        opacity: 0;
        transform: translate(0);
        clip-path: inset(0 0 100% 0);
      }

      78% {
        opacity: 0.7;
        transform: translateX(-5px);
        clip-path: inset(16% 0 67% 0);
      }

      79% {
        opacity: 0.45;
        transform: translateX(4px);
        clip-path: inset(62% 0 14% 0);
      }

      80% {
        opacity: 0.65;
        transform: translateX(-2px);
        clip-path: inset(39% 0 42% 0);
      }

      81% {
        opacity: 0;
        transform: translate(0);
        clip-path: inset(0 0 100% 0);
      }
    }

    @keyframes glitchRed {
      0%,
      77%,
      100% {
        opacity: 0;
        transform: translate(0);
        clip-path: inset(100% 0 0 0);
      }

      78% {
        opacity: 0.52;
        transform: translateX(5px);
        clip-path: inset(57% 0 23% 0);
      }

      79% {
        opacity: 0.72;
        transform: translateX(-3px);
        clip-path: inset(8% 0 74% 0);
      }

      80% {
        opacity: 0.4;
        transform: translateX(3px);
        clip-path: inset(76% 0 6% 0);
      }

      81% {
        opacity: 0;
        transform: translate(0);
        clip-path: inset(100% 0 0 0);
      }
    }

    /* CONTENT */

    .content {
      width: 100%;
      max-width: var(--content-width);
      margin: 0 auto;
      padding: clamp(75px, 11vw, 175px) var(--page-padding) 70px;
    }

    .description {
      display: flex;
      justify-content: center;
    }

    .description img {
      width: min(100%, 830px);
      height: auto;
      object-fit: contain;
    }

    .buttons {
      display: flex;
      justify-content: center;
      margin-top: clamp(38px, 6vw, 78px);
    }

    .btn {
      min-width: 205px;
      padding: 17px 28px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 14px 34px rgba(255, 255, 255, 0.08);
    }

    /* VIDEOS */

    .video-section {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      width: min(100%, 440px);
      margin: clamp(85px, 12vw, 165px) auto 0;
    }

    .video-box {
      position: relative;
      aspect-ratio: 9 / 15;
      overflow: hidden;
      border-radius: 20px;
      background: #050505;
      cursor: pointer;
      box-shadow: 0 18px 58px rgba(0, 0, 0, 0.46);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .video-box:hover {
      transform: translateY(-6px);
      box-shadow: 0 27px 72px rgba(0, 0, 0, 0.66);
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .video-box:hover video {
      transform: scale(1.025);
    }

    .video-box::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.57),
        rgba(0, 0, 0, 0) 34%
      );
    }

    .video-text {
      position: absolute;
      z-index: 1;
      left: 19px;
      bottom: 18px;
      font-size: 9px;
      letter-spacing: 2.5px;
      opacity: 0.9;
      pointer-events: none;
      text-shadow: 0 1px 18px #000;
    }

    /* INSTAGRAM */

    .instagram-section {
      width: 100%;
      margin-top: clamp(90px, 13vw, 175px);
      padding-top: clamp(34px, 5vw, 65px);
      border-top: 1px solid var(--soft-line);
      text-align: center;
    }

    .section-kicker {
      color: rgba(255, 255, 255, 0.56);
      font-size: 9px;
      letter-spacing: 4px;
    }

    .section-title {
      margin-top: 15px;
      font-size: clamp(18px, 2.5vw, 29px);
      font-weight: 400;
      letter-spacing: clamp(2px, 0.5vw, 6px);
    }

    .instagram-feed {
      width: 100%;
      margin: clamp(34px, 5vw, 62px) auto 0;
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 230px;
      margin-top: 26px;
      padding: 15px 22px;
      border: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: 2px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .instagram-link:hover {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.08);
    }

    /* GALLERY */

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      margin-top: clamp(90px, 13vw, 180px);
    }

    .gallery > img,
    .middle-stack img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      border-radius: 18px;
      background: #111;
      cursor: pointer;
      transition: transform 0.5s ease, filter 0.5s ease;
    }

    .gallery > img:hover,
    .middle-stack img:hover {
      transform: scale(1.015);
      filter: brightness(1.08);
    }

    .middle-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ANIMATIONS */

    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1.1s ease forwards;
    }

    .buttons.fade-in {
      animation-delay: 0.12s;
    }

    .video-section.fade-in {
      animation-delay: 0.2s;
    }

    .instagram-section.fade-in {
      animation-delay: 0.25s;
    }

    .gallery.fade-in {
      animation-delay: 0.3s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .grain {
      position: fixed;
      z-index: 9999;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("grain.png");
      background-size: cover;
      mix-blend-mode: soft-light;
    }

    /* TABLET AND DESKTOP */

    @media (min-width: 601px) {
      .hero-branding {
        width: min(57vw, 860px);
      }

      .logo-glitch {
        width: min(33%, 230px);
      }

      .video-section {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(20px, 4vw, 64px);
        width: min(100%, 1080px);
      }

      .gallery {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 0.8fr) minmax(0, 1fr);
        align-items: start;
        gap: clamp(14px, 2vw, 28px);
      }

      .gallery > img {
        height: min(78vw, 1100px);
        aspect-ratio: auto;
      }

      .middle-stack {
        display: grid;
        grid-template-rows: repeat(3, 1fr);
        gap: clamp(14px, 2vw, 28px);
        height: min(78vw, 1100px);
      }

      .middle-stack img {
        height: 100%;
        min-height: 0;
        aspect-ratio: auto;
      }
    }

    @media (min-width: 901px) {
      .hero-branding {
        top: clamp(55px, 8vw, 145px);
        width: min(53vw, 860px);
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: #262626;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body oncontextmenu="return false">
  <audio id="clickSound" src="click.mp3" preload="auto"></audio>

  <!-- HERO -->
  <section class="hero" aria-label="Alejandro Mazo hero photograph">
    <img
      class="hero-photo"
      src="Hero-2.jpg"
      alt="Freestyle motocross photograph by Alejandro Mazo"
    >

    <div class="hero-branding">
      <div
        class="glitch-layer title-glitch"
        style="--glitch-image: url('title.png');"
      >
        <img class="title-img" src="title.png" alt="Alejandro Mazo">
      </div>

      <div
        class="glitch-layer logo-glitch"
        style="--glitch-image: url('logo.png');"
      >
        <img class="logo-img" src="logo.png" alt="">
      </div>
    </div>
  </section>

  <!-- MAIN CONTENT -->
  <main class="content">
    <section class="description fade-in">
      <img
        src="description.png"
        alt="Alejandro Mazo photographer and filmmaker"
      >
    </section>

    <nav class="buttons fade-in" aria-label="Portfolio navigation">
      <a href="contact.html">
        <div class="btn">CONTACT</div>
      </a>
    </nav>

    <!-- FEATURED REELS -->
    <section class="video-section fade-in" aria-label="Featured video reels">
      <div class="video-box" role="button" tabindex="0" aria-label="Toggle sound for first reel">
        <video
          src="reel.mp4"
          autoplay
          loop
          muted
          playsinline
          webkit-playsinline
          preload="metadata"
        ></video>

        <div class="video-text">TAP FOR SOUND</div>
      </div>

      <div class="video-box" role="button" tabindex="0" aria-label="Toggle sound for second reel">
        <video
          src="video2.mp4"
          autoplay
          loop
          muted
          playsinline
          webkit-playsinline
          preload="metadata"
        ></video>

        <div class="video-text">TAP FOR SOUND</div>
      </div>
    </section>

    <!-- LIVE INSTAGRAM FEED -->
    <section class="instagram-section fade-in" aria-label="Latest from Instagram">
      <p class="section-kicker">LIVE FROM INSTAGRAM</p>
      <h2 class="section-title">LATEST WORK</h2>

      <div class="instagram-feed">
        <script src="https://elfsightcdn.com/platform.js" async></script>
        <div
          class="elfsight-app-eb70c165-4370-452c-b268-90bafd9a5307"
          data-elfsight-app-lazy
        ></div>
      </div>

      <a
        class="instagram-link"
        href="https://www.instagram.com/ale_mazo/"
        target="_blank"
        rel="noopener noreferrer"
      >
        FOLLOW @ALE_MAZO
      </a>
    </section>

    <!-- GALLERY -->
    <section class="gallery fade-in" aria-label="Photography gallery">
      <img src="image4.jpg" loading="lazy" alt="Alejandro Mazo photography">

      <div class="middle-stack">
        <img src="image5.jpg" loading="lazy" alt="Alejandro Mazo photography">
        <img src="image2.jpg" loading="lazy" alt="Alejandro Mazo photography">
        <img src="image3.jpg" loading="lazy" alt="Alejandro Mazo photography">
      </div>

      <img src="image1.jpg" loading="lazy" alt="Alejandro Mazo photography">
    </section>
  </main>

  <div class="grain" aria-hidden="true"></div>

  <script>
    const clickSound = document.getElementById("clickSound");

    function playClickSound() {
      clickSound.currentTime = 0;
      clickSound.play().catch(() => {});
    }

    document.querySelectorAll(".buttons a").forEach((link) => {
      link.addEventListener("click", playClickSound);
    });

    function startVideos() {
      document.querySelectorAll("video").forEach((video) => {
        video.muted = true;
        video.defaultMuted = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.play().catch(() => {});
      });
    }

    window.addEventListener("load", startVideos);

    document.querySelectorAll(".video-box").forEach((box) => {
      const video = box.querySelector("video");
      const label = box.querySelector(".video-text");

      function toggleSound() {
        video.muted = !video.muted;
        label.textContent = video.muted ? "TAP FOR SOUND" : "TAP TO MUTE";

        if (video.paused) {
          video.play().catch(() => {});
        }
      }

      box.addEventListener("click", toggleSound);

      box.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleSound();
        }
      });
    });
  </script>
</body>
</html>
